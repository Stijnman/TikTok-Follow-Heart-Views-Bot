name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile maintained Python sources
        run: |
          python -m compileall -q src tests 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          import py_compile
          candidates = [p for p in Path('.').glob('*.py') if p.name != 'TikTok-Views-Follow-Heart-Bot.py']
          for path in candidates:
              py_compile.compile(str(path), doraise=True)
          print(f"Validated {len(candidates)} maintained top-level Python files; legacy upstream bot is excluded from syntax gating.")
          PY

      - name: Set up pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install markdownlint
        run: npm install --global markdownlint-cli2

      - name: Lint portfolio documentation
        run: |
          markdownlint-cli2 --config .markdownlint.json ".github/**/*.md" "#node_modules"
